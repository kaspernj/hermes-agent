[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-tensorbuzz-pr-webhook-registrar"
version = "0.1.0"
description = "Host-owned TensorBuzz PR webhook registrar for Hermes"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["tensorbuzz_pr_webhook_registrar*"]
